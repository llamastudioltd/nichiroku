{{ $page := . }}

<tr class="posts__row">
  {{ if eq $page.Type "Bookmark" }}
  <th class="posts__cell">
    <a href="{{ $page.Params.Url }}">{{ $page.Title }}</a> via <a href="{{ $page.Params.Source.Url }}">{{ $page.Params.Source.Title }}</a>
  </th><!-- .posts__cell -->
  {{ end }}
  
  <td class="posts__cell">
    {{ with $page.GetTerms "tags" }}
    <div class="terms">
      <ul class="terms__list">
        {{ range . }}
        <li class="terms__item">
          <a class="terms__link" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        </li><!-- .terms__item -->
        {{ end }}
      </ul><!-- terms__list -->
    </div><!-- .terms -->
  {{ end }}
  </td><!-- .posts__cell -->
  
  <td class="posts__cell">
    {{ time.Format "02 January 2006" $page.Date }}
  </td><!-- .posts__cell -->
</tr><!-- .posts__row -->
