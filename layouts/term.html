{{ define "main" }}
  {{ $site := $.Site }}
  {{ $page := . }}
  
  <main class="site__main">
    <div class="page">
      <header class="page__header">
       <h1 class="page__title">Tagged with &ldquo;{{ $page.Title }}&rdquo;</h1>
      </header><!-- .page__header -->
      
      <div class="page__body">
        {{ with $page.Content }}
        <div class="copy">
          {{ . }}
        </div>
        {{ end }}
        
        {{ with $page.Pages }}
        <div class="posts">
          {{ partial "posts/table.html" .ByDate.Reverse }}
        </div><!-- .posts -->
        {{ end }}
      </div><!-- .page__body -->
    </div><!-- .page -->
  </main><!-- .site__main -->
{{ end }}
