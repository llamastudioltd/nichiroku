<!DOCTYPE html>
<html lang="{{ $.Site.LanguageCode | default "en" }}">
	<head>
		{{ partial "head" . }}
	</head>
	<body id="ue" kind="{{ .Kind }}" type="{{ .Type }}">
		<div class="l_site">
			<main class="l_site__body {{ with (.Resources.GetMatch "m_post__blob*") }}l_site__body--page-with-blob{{ end }}">
				{{ block "main" . }}{{ end }}
			</main>
			
			<footer class="l_site__menu">
				{{ partial "m_menu" . }}
			</footer>
		</div>
		
		{{ if (eq (getenv "HUGO_ENV") "production") }}
		{{ with $.Site.Params.analytics }}
		{{ range . }}
			{{ safeHTML . }}
		{{ end }}
		{{ end }}
		{{ end }}
	</body>
</html>
