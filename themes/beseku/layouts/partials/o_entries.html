{{ $pages := . }}

<div class="o_entries">
  <ol class="o_entries__list">
    {{ range $pages }}

    {{ $page := . }}
    {{ $section := cond (eq $page.Parent.Kind "section") $page.Parent $page }}

    <li class="o_entries__node o_entries__node--{{ $section.Params.Color }}">
      {{ partial "o_entry" $page }}
    </li><!-- o_entries__node -->
    {{ end }}
  </ol><!-- o_entries__list -->
</div><!-- o_entries -->
