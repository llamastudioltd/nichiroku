{{ $site := $.Site }}
{{ $page := . }}

<li class="CardsNode">
  <a class="Card" href="{{ $page.RelPermalink }}">
    <div class="CardHeader">
      <div class="img"></div>
    </div><!-- .CardHeader -->
    <div class="CardMain">
      <h1 class="CardTitle">
        {{ $page.Title }}
      </h1>
      {{ with $page.Params.Subtitle }}
      <h2 class="CardSubtitle">
        {{ . }}
      </h2>
      {{ end }}
    </div><!-- .CardMain -->
  </a><!-- .Card -->
</li>
