{{ define "main" }}
  {{ $site := $.Site }}
  {{ $page := . }}
  
  <div class="Article">
    <div class="ArticleHeader">
      <h1 class="ArticleTitle">
        {{ $page.Title }}
      </h1>
      
      {{ with $page.Params.Subtitle }}
      <h2 class="ArticleSubtitle">
        {{ . }}
      </h2>
      {{ end }}
    </div><!-- .ArticleHeader -->
    
    <div class="ArticleBody">
      {{ $page.Content }}
    </div><!-- .ArticleBody -->
  </div><!-- .Article -->
{{ end }}
