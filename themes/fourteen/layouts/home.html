{{ define "main" }}
  {{ $site := $.Site }}
  {{ $page := . }}
  
  <div class="Tags">
    <ul class="TagsList">
      <li class="TagsNode"><strong><a aria-current="page" class="TagsLink TagsLink:Current" href="{{ $site.BaseURL }}">Everything</a></strong></li>
      
      {{ range $site.Taxonomies.tags }}
      <li class="TagsNode"><a class="TagsLink" href="{{ .Page.Permalink }}">{{ .Page.Title }}</a></li>
      {{ end }}
    </ul><!-- .TagsList -->
  </div><!-- .Tags -->
  
  <div class="Cards">
  {{ with where $site.RegularPages.ByDate.Reverse "Section" "portfolio" }}
  {{ partial "cards_list.html" . }}
  {{ end }}
  </div><!-- .Cards -->
{{ end }}
