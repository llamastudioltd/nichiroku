{{ $src := .Get "src" }}
{{ $alt := .Get "alt" }}

{{ with .Page.Resources.GetMatch $src }}
  {{ $webp := .Process "webp q85" }}
  <picture>
    <source srcset="{{ $webp.RelPermalink }}" type="image/webp">
    <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}"{{ with $alt }} alt="{{ . }}"{{ end }} loading="lazy">
  </picture>
{{ end }}
